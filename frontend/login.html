<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ClassHub | IFSULDEMINAS</title>
  
  <!-- Bootstrap 5 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Estilos Customizados (Inspirado no SUAP) -->
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Coluna da Esquerda: Marca e Ilustração Institucional -->
      <section class="auth-brand-side">
        <header class="brand-header">
          <a href="login.html" class="brand-logo-text">class<span>hub</span></a>
          <div class="brand-divider"></div>
          <div class="brand-institution">
            <span class="institution-title">INSTITUTO FEDERAL</span>
            <span class="institution-subtitle">Sul de Minas Gerais</span>
          </div>
        </header>

        <div class="brand-hero">
          <img src="assets/illustration.svg" alt="Bate-papo" class="brand-illustration">
        </div>

        <footer class="brand-footer">
          Sistemas Distribuídos &bull; IFSULDEMINAS – Campus Poços de Caldas
        </footer>
      </section>

      <!-- Coluna da Direita: Card de Autenticação SUAP -->
      <main class="auth-form-side">
        <div class="auth-card-content">
          
          <div class="auth-header">
            <h1 class="auth-title">Login</h1>
          </div>

          <!-- Alerta Visual de Erro/Sucesso no formato do SUAP -->
          <div id="auth-alert" class="suap-alert" role="alert"></div>

          <!-- Formulário de Login -->
          <form id="login-form" novalidate>
            <!-- Campo E-mail -->
            <div class="form-group-suap">
              <label for="username" class="form-label-suap">
                <i class="bi bi-at"></i> Nome de Usuário:
              </label>
              <input 
                type="text" 
                id="username" 
                name="username" 
                class="form-control-suap" 
                placeholder="ex: caioprinc"
                autocomplete="username"
                required
              >
              <div id="username-feedback" class="invalid-feedback-suap"></div>
            </div>

            <!-- Campo Senha -->
            <div class="form-group-suap">
              <label for="password" class="form-label-suap">
                <i class="bi bi-lock-fill"></i> Senha:
              </label>
              <div class="password-wrapper">
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  class="form-control-suap" 
                  placeholder="Sua senha"
                  autocomplete="current-password" 
                  required
                >
                <button type="button" id="toggle-password" class="password-toggle-btn" aria-label="Mostrar ou ocultar senha">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div id="password-feedback" class="invalid-feedback-suap"></div>
            </div>

            <!-- Botão de Ação Principal -->
            <button type="submit" id="btn-submit" class="btn-suap-primary">
              Acessar
            </button>

            <!-- Links Auxiliares -->
            <div class="auth-aux-links">
              <a href="recuperacao.html" class="link-suap">
                Esqueceu ou deseja alterar sua senha?
              </a>
            </div>

            <!-- Rodapé do Card: Criar Nova Conta -->
            <div class="auth-card-footer">
              Primeira vez no ClassHub?
              <a href="cadastro.html" class="link-suap">
                Acesse o cadastro e crie sua conta
              </a>
            </div>
          </form>

        </div>
      </main>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
