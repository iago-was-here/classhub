<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperação de Senha - ClassHub | IFSULDEMINAS</title>
  
  <!-- Bootstrap 5 & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Estilos Customizados (Inspirado no SUAP) -->
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Coluna da Esquerda: Marca e Ilustração Institucional -->
      <section class="auth-brand-side">
        <header class="brand-header">
          <a href="login.html" class="brand-logo-text">class<span>hub</span></a>
          <div class="brand-divider"></div>
          <div class="brand-institution">
            <span class="institution-title">INSTITUTO FEDERAL</span>
            <span class="institution-subtitle">Sul de Minas Gerais</span>
          </div>
        </header>

        <div class="brand-hero">
          <p class="brand-slogan">
            Recupere o acesso à sua conta e retorne às suas atividades no ClassHub.
          </p>
          <img src="assets/illustration.svg" alt="Comunidade Acadêmica IFSULDEMINAS" class="brand-illustration">
        </div>

        <footer class="brand-footer">
          Sistemas Distribuídos &bull; IFSULDEMINAS – Campus Poços de Caldas
        </footer>
      </section>

      <!-- Coluna da Direita: Card de Redefinição de Senha -->
      <main class="auth-form-side">
        <div class="auth-card-content">
          
          <div class="auth-header">
            <h1 class="auth-title">Recuperar Senha</h1>
          </div>

          <!-- Alerta Visual de Erro/Sucesso -->
          <div id="auth-alert" class="suap-alert" role="alert"></div>

          <!-- Formulário de Recuperação -->
          <form id="recuperacao-form" novalidate>
            <!-- E-mail -->
            <div class="form-group-suap">
              <label for="email" class="form-label-suap">
                <i class="bi bi-envelope-fill"></i> E-mail Cadastrado:
              </label>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-control-suap" 
                placeholder="nome.sobrenome@alunos.ifsuldeminas.edu.br"
                autocomplete="email"
                required
              >
              <div id="email-feedback" class="invalid-feedback-suap"></div>
            </div>

            <!-- Botão de Ação -->
            <button type="submit" id="btn-submit" class="btn-suap-primary">
              <i class="bi bi-send-fill me-2"></i> Enviar e-mail de recuperação
            </button>

            <!-- Rodapé do Card: Retornar ao Login -->
            <div class="auth-card-footer">
              Lembrou sua senha de acesso?
              <a href="login.html" class="link-suap">
                Voltar para a tela de login
              </a>
            </div>
          </form>

        </div>
      </main>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/recuperacao.js"></script>
</body>
</html>
